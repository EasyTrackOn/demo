<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Ledger | Interactive Magazine</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root {
            --w: 380px; --h: 580px;
            --primary: #1a1a1a; --paper: #ffffff; --accent: #c0392b;
            --top-bar-h: 50px;
            --bottom-bar-h: 60px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background-color: #121212; font-family: 'Inter', sans-serif; color: white; min-height: 100vh; overflow: hidden; }

        /* --- HOME PAGE --- */
        #home-page { width: 100%; height: 100vh; padding: 20px; overflow-y: auto; text-align: center; }
        .magazine-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; max-width: 1100px; margin: 20px auto; }
        .mag-thumb { cursor: pointer; background: #1e1e1e; padding: 15px; border-radius: 8px; transition: 0.3s; }
        .mag-thumb:hover { transform: translateY(-5px); background: #252525; }
        .mag-thumb img { width: 100%; height: 280px; object-fit: cover; border-radius: 4px; }

        /* --- READER VIEW --- */
        #reader-view { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: #000; display: none; flex-direction: column; 
            align-items: center; justify-content: center; z-index: 1000; 
        }

        .reader-top-bar {
            position: fixed; top: 0; left: 0; width: 100%; height: var(--top-bar-h);
            background: #1a1a1a; display: flex; align-items: center; 
            justify-content: space-between; padding: 0 15px; z-index: 1100;
            border-bottom: 1px solid #333;
        }
        .close-btn { font-size: 1.8rem; color: #fff; background: none; border: none; cursor: pointer; }

        .reader-bottom-bar {
            position: fixed; bottom: 0; left: 0; width: 100%; height: var(--bottom-bar-h);
            background: #1a1a1a; display: flex; align-items: center; 
            justify-content: center; gap: 40px; z-index: 1100;
            border-top: 1px solid #333;
        }
        .nav-btn { 
            background: #333; color: #fff; border: none; padding: 8px 20px; 
            border-radius: 4px; font-weight: 600; cursor: pointer;
        }

        /* --- BOOK ENGINE --- */
        .book-container {
            margin-top: var(--top-bar-h);
            margin-bottom: var(--bottom-bar-h);
            perspective: 2000px;
            display: flex; align-items: center; justify-content: center;
        }

        .book { 
            position: relative; width: var(--w); height: var(--h); 
            transition: transform 0.5s; transform-style: preserve-3d; 
        }
        
        /* Desktop: Move book to right when open */
        @media (min-width: 768px) { .book.open { transform: translateX(50%); } }

        .paper { 
            position: absolute; width: 100%; height: 100%; top: 0; left: 0; 
            transform-origin: left; transition: transform 0.7s cubic-bezier(0.645, 0.045, 0.355, 1); 
            transform-style: preserve-3d;
            pointer-events: none; /* Crucial: clicks pass through stack */
        }

        .paper.active, .paper.flipped { pointer-events: auto; }

        .front, .back { 
            position: absolute; width: 100%; height: 100%; top: 0; left: 0; 
            background-color: var(--paper); backface-visibility: hidden; 
            box-shadow: inset 3px 0px 20px rgba(0,0,0,0.1); 
            overflow-y: auto; color: #333; padding: 20px;
        }

        .back { transform: rotateY(180deg); }
        .paper.flipped { transform: rotateY(-180deg); }

        /* Decorative Spine Shadow */
        .front::before {
            content: ""; position: absolute; top: 0; left: 0; width: 5px; height: 100%;
            background: linear-gradient(to right, rgba(0,0,0,0.1), transparent);
        }

        /* Responsive Mobile View */
        @media (max-width: 767px) {
            :root { --w: 85vw; --h: 70vh; }
            .paper { transform-origin: center; display: none; }
            .paper.active { display: block; }
            .paper.show-back .front { display: none; }
            .paper.show-back .back { transform: rotateY(0deg); }
        }
    </style>
</head>
<body>

    <div id="home-page">
        <h1 style="font-family:'Playfair Display'; margin: 20px 0;">E-Library</h1>
        <div class="magazine-grid" id="magazine-grid"></div>
    </div>

    <div id="reader-view">
        <div class="reader-top-bar">
            <span id="active-mag-title" class="px-3">Loading...</span>
            <button class="close-btn" onclick="closeReader()">&times;</button>
        </div>

        <div class="book-container">
            <div class="book" id="book"></div>
        </div>

        <div class="reader-bottom-bar">
            <button class="nav-btn" onclick="prevPage()">PREV</button>
            <button class="nav-btn" onclick="nextPage()">NEXT</button>
        </div>
    </div>

    <script>
        const GAS_URL = "https://script.google.com/macros/s/AKfycbx7GvBfO0bzBxDttsk2QYBfqLHae0m4InojyNdf9_GGizwHbFAEHiEap4k-Fpu6vGqSFw/exec";
        let currentPaper = 1;
        let totalPapers = 0;
        let showingBack = false;

        const isMobile = () => window.innerWidth < 768;

        async function init() {
            const grid = document.getElementById('magazine-grid');
            try {
                const res = await fetch(GAS_URL);
                const mags = await res.json();
                grid.innerHTML = mags.map(m => `
                    <div class="mag-thumb" onclick="openBook('${m.id}', '${m.title}')">
                        <img src="${m.cover}" loading="lazy">
                        <h3 class="mt-2" style="font-size:1.1rem;">${m.title}</h3>
                    </div>
                `).join('');
            } catch (e) {
                grid.innerHTML = "<h3>Error loading library.</h3>";
            }
        }

        async function openBook(magId, magTitle) {
            document.getElementById('active-mag-title').innerText = magTitle;
            try {
                const res = await fetch(`${GAS_URL}?magId=${magId}`);
                const data = await res.json();
                renderMagazine(data);
            } catch (e) { alert("Error fetching content."); }
        }

        function renderMagazine(data) {
            const container = document.getElementById('book');
            container.innerHTML = "";
            
            // Group data into pairs for papers
            for (let i = 0; i < data.length; i += 2) {
                const paperNum = (i / 2) + 1;
                const frontContent = data[i]?.content || '';
                const backContent = data[i+1]?.content || (i+1 < data.length ? '' : '<div class="text-center mt-5"><h2>FIN</h2></div>');
                
                const paper = document.createElement('div');
                paper.className = `paper ${paperNum === 1 ? 'active' : ''}`;
                paper.id = `p${paperNum}`;
                paper.style.zIndex = 100 - paperNum; // Initial stack: 1 on top
                
                paper.innerHTML = `
                    <div class="front">${frontContent}</div>
                    <div class="back">${backContent}</div>
                `;
                container.appendChild(paper);
            }

            totalPapers = Math.ceil(data.length / 2);
            currentPaper = 1;
            showingBack = false;
            document.getElementById('home-page').style.display = 'none';
            document.getElementById('reader-view').style.display = 'flex';
        }

        function nextPage() {
            if (currentPaper > totalPapers) return;

            if (isMobile()) {
                const p = document.getElementById(`p${currentPaper}`);
                if (!showingBack) {
                    p.classList.add('show-back');
                    showingBack = true;
                } else if (currentPaper < totalPapers) {
                    p.classList.remove('active');
                    currentPaper++;
                    document.getElementById(`p${currentPaper}`).classList.add('active');
                    showingBack = false;
                }
            } else {
                const p = document.getElementById(`p${currentPaper}`);
                if (p) {
                    p.classList.add('flipped');
                    // When flipped, it should move to the bottom of the left stack
                    p.style.zIndex = currentPaper; 
                    if (currentPaper === 1) document.getElementById('book').classList.add('open');
                    
                    currentPaper++;
                    // Make the next paper "active" so it's clickable
                    if(currentPaper <= totalPapers) {
                        document.getElementById(`p${currentPaper}`).classList.add('active');
                    }
                }
            }
        }

        function prevPage() {
            if (currentPaper < 1) return;

            if (isMobile()) {
                const p = document.getElementById(`p${currentPaper}`);
                if (showingBack) {
                    p.classList.remove('show-back');
                    showingBack = false;
                } else if (currentPaper > 1) {
                    p.classList.remove('active');
                    currentPaper--;
                    const prev = document.getElementById(`p${currentPaper}`);
                    prev.classList.add('active', 'show-back');
                    showingBack = true;
                }
            } else {
                if (currentPaper > 1) {
                    currentPaper--;
                    const p = document.getElementById(`p${currentPaper}`);
                    p.classList.remove('flipped');
                    // Return to its original stack position
                    p.style.zIndex = 100 - currentPaper; 
                    
                    if (currentPaper === 1) document.getElementById('book').classList.remove('open');
                }
            }
        }

        function closeReader() {
            document.getElementById('reader-view').style.display = 'none';
            document.getElementById('home-page').style.display = 'block';
            document.getElementById('book').classList.remove('open');
        }

        window.onload = init;
    </script>
</body>
</html>
